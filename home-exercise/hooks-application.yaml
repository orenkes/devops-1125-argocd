apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hooks-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/orenkes/devops-1125-argocd.git
    targetRevision: main
    path: home-exercise/jobs

  destination:
    server: https://kubernetes.default.svc
    namespace: hooks

  syncPolicy:
    automated: {}
